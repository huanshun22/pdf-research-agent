[project]
name = "pdf-research-agent"
version = "0.1.0"
description = "单用途 AI Agent：用自然语言检索和阅读本地 PDF（MCP + ReAct）"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0",
    "pypdf>=4.0",
    "pydantic>=2.7",
    "openai>=1.40",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
pdf-agent = "src.cli:app"
pdf-web = "src.web.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Phase 2 将追加：openai、typer、python-dotenv

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.mcp_server", "src.web"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
